replicaCount: 2

image:
  repository: ghcr.io/cloudraftio/metrics-app
  pullPolicy: IfNotPresent
  tag: 1.4 

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

ingress:
  hosts:
    - host: "" 
      paths:
        - path: /
          pathType: Prefix

service:
  type: ClusterIP
  port: 8080

resources: 
   limits:
     cpu: 100m
     memory: 128Mi
   requests:
     cpu: 100m
     memory: 128Mi

livenessProbe:
  initialDelaySeconds: 15
  httpGet:
    path: /
    port: 8080
readinessProbe:
  initialDelaySeconds: 15 
  httpGet:
    path: /
    port: 8080

autoscaling:
  enabled: false

app:
  sealedPassword: ""

env:
  password: PASSWORD
