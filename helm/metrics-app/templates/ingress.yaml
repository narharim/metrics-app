apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "metrics-app.fullname" . }}-ingress
spec:
  rules:
    - http:
        paths:
          {{- range (index .Values.ingress.hosts 0).paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "metrics-app.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}

